<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fútbol Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;700&display=swap">
<style>
  /* Cancha de noche: pasto oscuro, cal blanca, marcador ámbar */
  :root {
    --pasto: #0f3b25; --pasto2: #145030; --cal: #f4f7f2; --ambar: #ffc23d; --tinta: #0a2016; --suave: #a9c9b5;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --texto: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--texto); color: var(--cal);
    background: repeating-linear-gradient(90deg, var(--pasto) 0 60px, var(--pasto2) 60px 120px);
    display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { width: min(560px, 100%); display: grid; gap: 28px; text-align: center; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 9vw, 64px); line-height: .95; margin: 0; letter-spacing: 1px; }
  h1 span { color: var(--ambar); display: block; }
  p.lead { margin: 0; font-size: 19px; color: var(--suave); }
  .opciones { display: grid; gap: 14px; }
  a.boton, button {
    font: 700 20px/1 var(--texto); text-transform: uppercase; letter-spacing: 1.5px;
    border: 3px solid var(--cal); border-radius: 14px; padding: 20px; cursor: pointer;
    text-decoration: none; display: block; color: var(--tinta); background: var(--ambar); border-color: var(--ambar);
  }
  a.boton:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--cal); outline-offset: 3px; }
  form { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  form button { background: transparent; color: var(--cal); border-color: var(--cal); padding: 18px 22px; }
  input {
    font: 400 26px/1 var(--display); text-align: center; letter-spacing: 8px; text-transform: uppercase;
    min-width: 0; padding: 14px; border-radius: 14px; border: 3px solid var(--cal); background: var(--tinta); color: var(--cal);
  }
  .pasos { font-size: 16px; color: var(--suave); line-height: 1.5; margin: 0; }
  .pasos b { color: var(--cal); }
</style>
</head>
<body>
<main>
  <h1>Fútbol <span>Control</span></h1>
  <p class="lead">La compu es la cancha. Tu teléfono es el control.</p>
  <div class="opciones">
    <a class="boton" href="/pantalla">Abrir la cancha en esta pantalla</a>
    <form id="unirse">
      <label for="codigo" class="pasos" style="grid-column:1/-1">¿Ya tenés el código? Escribilo aquí:</label>
      <input id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" aria-label="Código de la cancha">
      <button type="submit">Entrar</button>
    </form>
  </div>
  <p class="pasos"><b>1.</b> Abrí la cancha en la computadora. <b>2.</b> Escaneá el QR con el teléfono. <b>3.</b> ¡A jugar! Con un solo teléfono jugás contra la compu.</p>
</main>
<script>
  document.getElementById("unirse").addEventListener("submit", e => {
    e.preventDefault();
    const c = document.getElementById("codigo").value.trim().toUpperCase();
    if (/^[A-Z]{4}$/.test(c)) location.href = "/c/" + c;
    else document.getElementById("codigo").focus();
  });
</script>
</body>
</html>
