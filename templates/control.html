<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a2016">
<title>Control · Fútbol Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@500;700&display=swap">
<style>
  :root {
    --fondo: #0a2016; --pasto: #123d27; --cal: #f4f7f2; --suave: #a9c9b5; --ambar: #ffc23d;
    --color: #3fa9ff; /* cambia según el jugador */
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --texto: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--fondo); color: var(--cal); font-family: var(--texto);
    touch-action: none; user-select: none; -webkit-user-select: none;
    display: grid; grid-template-rows: auto 1fr;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-bottom: 3px solid var(--color);
  }
  .camiseta { display: flex; align-items: center; gap: 10px; font: 400 18px/1 var(--display); }
  .camiseta i { width: 26px; height: 26px; border-radius: 50%; background: var(--color); border: 3px solid var(--cal); }
  #estado { font-size: 15px; color: var(--suave); text-align: right; }
  #estado.ok::before { content: "●  "; color: #49e07b; }
  #estado.mal::before { content: "●  "; color: #ff6b5b; }
  .mando { display: grid; grid-template-columns: 1fr 1fr; align-items: center; justify-items: center; gap: 12px; padding: 12px 16px; }
  @media (orientation: portrait) { .mando { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }
  #pad {
    position: relative; width: min(64vmin, 300px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, var(--pasto) 55%, #0d3020 56%);
    border: 3px dashed rgba(244,247,242,.35);
  }
  #perilla {
    position: absolute; left: 50%; top: 50%; width: 38%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, -50%); background: var(--color); border: 4px solid var(--cal);
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  #patear {
    width: min(46vmin, 220px); aspect-ratio: 1; border-radius: 50%;
    font: 400 clamp(20px, 6vmin, 30px)/1 var(--display); color: var(--fondo);
    background: var(--ambar); border: 6px solid var(--cal); box-shadow: 0 8px 0 #b78300;
  }
  #patear.activo { transform: translateY(6px); box-shadow: 0 2px 0 #b78300; }
  #aviso {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
    background: rgba(10,32,22,.94); font-size: 20px; line-height: 1.4;
  }
  #aviso b { font: 400 34px/1.1 var(--display); color: var(--ambar); display: block; margin-bottom: 10px; }
  #flash { position: fixed; inset: 0; pointer-events: none; background: var(--ambar); opacity: 0; transition: opacity .5s; }
</style>
</head>
<body>
<header>
  <div class="camiseta"><i></i><span id="nombre">Conectando…</span></div>
  <div id="estado">Conectando</div>
</header>
<div class="mando">
  <div id="pad" aria-label="Joystick: arrastrá para moverte"><div id="perilla"></div></div>
  <button id="patear" aria-label="Patear">PATEAR</button>
</div>
<div id="aviso" hidden></div>
<div id="flash"></div>
<script>
(() => {
  const codigo = location.pathname.split("/").pop().toUpperCase();
  const COLORES = { 1: "#3fa9ff", 2: "#ff5b5b" };
  const $ = id => document.getElementById(id);
  const estado = $("estado"), aviso = $("aviso");
  let ws, jugador = null, intento = 0, x = 0, y = 0, enviado = "";

  function mostrarAviso(titulo, texto) { aviso.innerHTML = `<div><b>${titulo}</b>${texto}</div>`; aviso.hidden = false; }
  function vibrar(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  function conectar() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws/${codigo}/control`);
    ws.onopen = () => { intento = 0; estado.textContent = "Conectado"; estado.className = "ok"; };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === "asignado") {
        jugador = m.jugador;
        document.documentElement.style.setProperty("--color", COLORES[jugador]);
        $("nombre").textContent = `Jugador ${jugador}`;
        if (!m.pantalla) mostrarAviso("Falta la cancha", `Abrí la cancha en la computadora con el código <b style="display:inline;font-size:inherit">${codigo}</b>.`);
        else aviso.hidden = true;
        vibrar(60);
      } else if (m.type === "lleno") {
        mostrarAviso("Cancha llena", "Ya hay dos jugadores conectados en esta cancha.");
      } else if (m.type === "gol") {
        aviso.hidden = true;
        $("flash").style.opacity = .55; setTimeout(() => $("flash").style.opacity = 0, 250);
        vibrar(m.anotador === jugador ? [120, 60, 120, 60, 300] : 250);
      } else if (m.type === "fin") {
        vibrar([300, 100, 300]);
      } else if (m.type === "hola") {
        aviso.hidden = true;
      }
    };
    ws.onclose = () => {
      estado.textContent = "Reconectando"; estado.className = "mal";
      setTimeout(conectar, Math.min(4000, 500 * ++intento));
    };
  }

  function mandar(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  // Joystick
  const pad = $("pad"), perilla = $("perilla");
  let toque = null;
  function mover(e) {
    const r = pad.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2, radio = r.width / 2;
    let dx = (e.clientX - cx) / radio, dy = (e.clientY - cy) / radio;
    const d = Math.hypot(dx, dy);
    if (d > 1) { dx /= d; dy /= d; }
    x = dx; y = dy;
    perilla.style.transform = `translate(calc(-50% + ${dx * radio * .62}px), calc(-50% + ${dy * radio * .62}px))`;
  }
  function soltar() {
    toque = null; x = 0; y = 0;
    perilla.style.transform = "translate(-50%, -50%)";
  }
  pad.addEventListener("pointerdown", e => { toque = e.pointerId; pad.setPointerCapture(e.pointerId); mover(e); });
  pad.addEventListener("pointermove", e => { if (e.pointerId === toque) mover(e); });
  pad.addEventListener("pointerup", e => { if (e.pointerId === toque) soltar(); });
  pad.addEventListener("pointercancel", soltar);

  // Botón patear
  const boton = $("patear");
  boton.addEventListener("pointerdown", e => {
    e.preventDefault(); boton.classList.add("activo"); mandar({ type: "patear" }); vibrar(25);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(t => boton.addEventListener(t, () => boton.classList.remove("activo")));

  // Envío del joystick: ~30 veces por segundo cuando cambia, y cada 250 ms para mantener vivo
  let ultimo = 0;
  setInterval(() => {
    const ahora = performance.now();
    const s = `${x.toFixed(2)},${y.toFixed(2)}`;
    if (s !== enviado || ahora - ultimo > 250) {
      mandar({ type: "mover", x: +x.toFixed(2), y: +y.toFixed(2) });
      enviado = s; ultimo = ahora;
    }
  }, 33);

  // Mantener la pantalla encendida si el navegador lo permite
  async function despierto() { try { await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) despierto(); });
  despierto();

  conectar();
})();
</script>
</body>
</html>
